<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>October 1st 🤍</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         AUDIO
    ========================== -->

    <audio id="musica" loop preload="auto">
        october.mp3
        Tu navegador no soporta audio.
    </audio>


    <!-- =========================
         PANTALLA INICIAL
    ========================== -->

    <section class="inicio" id="inicio">

        <div class="inicio-contenido">

            <p class="fecha-inicio">
                OCTOBER 1ST
            </p>

            <h1>
                Tengo algo para ti 🤍
            </h1>

            <button id="botonComenzar" type="button">
                Toca aquí
            </button>

            <p class="instruccion">
                Usa audífonos 🎧
            </p>

        </div>

    </section>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main class="contenido" id="contenido">

        <!-- Hojas de otoño -->
        <div id="hojas"></div>


        <!-- =========================
             TÍTULO
        ========================== -->

        <div class="titulo">

            <p>01 • 10 • 2026</p>

            <h1>
                Para ti, mi Nei preciosa 🤍
            </h1>

        </div>


        <!-- =========================
             FOTO
        ========================== -->

        <div class="foto-contenedor">

            <div class="brillo-foto"></div>

            <img
                src="nei.jpeg"
                alt="Foto especial para octubre"
                class="foto"
            >

            <div class="overlay"></div>

        </div>


        <!-- =========================
             FRASE
        ========================== -->

        <div class="frase">

            <p class="linea linea-1">
                My girl,
            </p>

            <p class="linea linea-2">
                my girl...
            </p>

            <p class="linea linea-3">
                🤍
            </p>

        </div>


        <!-- =========================
             MENSAJE FINAL
        ========================== -->

        <div class="mensaje-final">

            <p>
                Mi octubre favorito comienza contigo.
            </p>

            <span>🤍</span>

        </div>


        <!-- =========================
             BOTÓN DE MÚSICA
        ========================== -->

        <button
            id="botonMusica"
            class="boton-musica"
            type="button"
            aria-label="Pausar o reproducir música"
        >
            ♫
        </button>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
